<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Results | Purpose Institute</title>

  <link rel="stylesheet" href="css/admin-shell.css">
  <link rel="stylesheet" href="css/admin.css">
  <link rel="stylesheet" href="css/results.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body>

  <div class="wrapper">

    <div id="sidebarMount"></div>

    <main class="main">

      <div id="topbarMount"></div>

      <section class="stats">

        <div class="card green">
          <div>
            <h4>Total Submissions</h4>
            <h2 id="totalSubmissions">0</h2>
          </div>
          <i class="fa-solid fa-file-circle-check"></i>
        </div>

        <div class="card blue">
          <div>
            <h4>Average Score</h4>
            <h2 id="averageScore">0%</h2>
          </div>
          <i class="fa-solid fa-chart-simple"></i>
        </div>

        <div class="card orange">
          <div>
            <h4>Quizzes Given</h4>
            <h2 id="quizCount">0</h2>
          </div>
          <i class="fa-solid fa-clipboard-question"></i>
        </div>

      </section>

      <div class="table-card">

        <div class="card-title">
          <h3>All Results</h3>
        </div>

        <div class="filters-row">
          <input type="text" id="searchResult" placeholder="Search student or quiz...">

          <select id="filterCourse">
            <option value="">All Courses</option>
          </select>
        </div>

        <table>
          <thead>
            <tr>
              <th>Student</th>
              <th>Course</th>
              <th>Quiz</th>
              <th>Score</th>
              <th>Submitted</th>
            </tr>
          </thead>
          <tbody id="resultsTable"></tbody>
        </table>

      </div>

    </main>

  </div>

  <script>
    window.ADMIN_PAGE = {
      active: "results",
      title: "Results",
    };
  </script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/admin-shell.js"></script>
  <script src="js/results.js"></script>

</body>
</html>
