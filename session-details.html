<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Session Details | Purpose Institute</title>
  <link rel="stylesheet" href="css/admin-shell.css">

  <link rel="stylesheet" href="css/admin.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body>

  <div class="wrapper">

    <!-- Sidebar -->
    <div id="sidebarMount"></div>

    <main class="main">
      <div id="topbarMount"></div>

      <!-- Session title + actions -->
      <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; margin-bottom: 25px;">
        <div>
          <h2 id="sessionTitle" style="font-size: 26px; margin-bottom: 4px;">Loading...</h2>
          <p id="sessionType" style="color: #64748B;"></p>
        </div>

        <div style="display: flex; gap: 12px;">
          <button id="publishToggle" class="assign-btn">
            <i class="fa-solid fa-circle-check"></i>
            <span id="publishToggleText">Publish</span>
          </button>

          <button id="editSession" class="view-btn">
            <i class="fa-solid fa-pen"></i>
            Edit Session
          </button>

          <button id="uploadMaterial" class="view-btn">
            <i class="fa-solid fa-upload"></i>
            Upload Material
          </button>
        </div>
      </div>

      <section class="stats">

        <div class="card green">
          <div>
            <h4>Materials</h4>
            <h2 id="materialCount">0</h2>
          </div>
          <i class="fa-solid fa-file"></i>
        </div>

        <div class="card blue">
          <div>
            <h4>Scheduled</h4>
            <h2 id="scheduledDate" style="font-size: 20px;">-</h2>
          </div>
          <i class="fa-solid fa-calendar"></i>
        </div>

        <div class="card orange">
          <div>
            <h4>Status</h4>
            <h2 id="sessionStatus" style="font-size: 20px;">-</h2>
          </div>
          <i class="fa-solid fa-circle-info"></i>
        </div>

        <div class="card purple">
          <div>
            <h4>Attendance</h4>
            <h2 id="attendanceCount" style="font-size: 20px;">0</h2>
          </div>
          <i class="fa-solid fa-user-check"></i>
        </div>

      </section>

      <div class="table-card">
        <div class="card-title">
          <h3>Description</h3>
        </div>
        <p id="description"></p>
      </div>

      <!-- Attendance -->
      <div class="table-card" style="margin-top: 30px;">
        <div class="card-title">
          <h3>Attendance</h3>
        </div>

        <!-- Manual override, for students who couldn't make the quiz
             window (e.g. work commitments) -->
        <div style="display:flex; gap:12px; align-items:flex-end; flex-wrap:wrap; margin-bottom:20px; padding-bottom:20px; border-bottom:1px solid #EEF2F7;">
          <div style="flex:1; min-width:220px;">
            <label style="display:block; font-size:13px; color:#64748B; margin-bottom:6px;">Mark a student present manually</label>
            <select id="manualAttendanceSelect" style="width:100%; padding:10px 14px; border:1px solid #E2E8F0; border-radius:10px; font-family:'Poppins',sans-serif;">
              <option value="">Select student...</option>
            </select>
          </div>
          <button id="markManualBtn" class="assign-btn">
            <i class="fa-solid fa-plus"></i> Mark Present
          </button>
        </div>

        <table>
          <thead>
            <tr>
              <th>Student</th>
              <th>Matric Number</th>
              <th>Method</th>
              <th>Marked At</th>
            </tr>
          </thead>
          <tbody id="attendanceTable"></tbody>
        </table>
      </div>

      <!-- Quiz -->
      <div class="table-card" style="margin-top: 30px;">
        <div class="card-title">
          <h3>Quiz</h3>
        </div>

        <div id="quizBox"></div>
      </div>

      <div class="table-card" style="margin-top: 30px;">
        <div class="card-title">
          <h3>Session Materials</h3>
        </div>

        <table>
          <thead>
            <tr>
              <th>Title</th>
              <th>Type</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="materialTable"></tbody>
        </table>
      </div>

    </main>

  </div>
  <script>
  window.ADMIN_PAGE = {
    active: "courses",
    title: "Session Details",
  };
</script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/admin-shell.js"></script>
  <script src="js/session-details.js"></script>

</body>
</html>
