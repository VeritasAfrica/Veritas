<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Course Details | Purpose Institute</title>
  <link rel="stylesheet" href="css/student-shell.css">
  <link rel="stylesheet" href="css/student-portal.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

  <div class="wrapper">

    <!-- Sidebar -->
    <div id="sidebarMount"></div>

    <!-- Main -->
    <main class="main">

      <div id="topbarMount"></div>
      <h1 id="courseTitle" style="margin-bottom: 4px;"></h1>
      <p class="page-subtitle" id="courseCode" style="font-weight: 500; color: var(--black);">-</p>

      <section class="stats">

        <div class="card green">
          <div>
            <h4>Sessions</h4>
            <h2 id="sessionCount">0</h2>
          </div>
          <i class="fa-solid fa-video"></i>
        </div>

        <div class="card blue">
          <div>
            <h4>Materials</h4>
            <h2 id="materialCount">0</h2>
          </div>
          <i class="fa-solid fa-file"></i>
        </div>

        <div class="card orange">
          <div>
            <h4>Announcements</h4>
            <h2 id="announcementCount">0</h2>
          </div>
          <i class="fa-solid fa-bullhorn"></i>
        </div>

        <div class="card purple">
          <div>
            <h4>Status</h4>
            <h2 id="courseStatus">-</h2>
          </div>
          <i class="fa-solid fa-circle-check"></i>
        </div>

      </section>

      <div class="table-card">
        <div class="card-title">
          <h3>Course Information</h3>
        </div>

        <p><strong>Department:</strong> <span id="department"></span></p>
        <br>
        <p><strong>Description</strong></p>
        <p id="description"></p>
      </div>

      <div class="table-card" style="margin-top: 30px;">
        <div class="card-title">
          <h3>Available Sessions</h3>
        </div>

        <table>
          <thead>
            <tr>
              <th>Week</th>
              <th>Title</th>
              <th>Type</th>
              <th>Date</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="sessionTable"></tbody>
        </table>
      </div>

      <div class="table-card" style="margin-top: 30px;">
        <div class="card-title">
          <h3>Announcements</h3>
          <a href="#" id="viewAllAnnouncements" style="color: var(--primary); text-decoration: none; font-weight: 600;">
            View All
          </a>
        </div>

        <div id="announcementList"></div>
      </div>

    </main>

  </div>
  <script>
    window.STUDENT_PAGE = {
        active: "courses",       // ← this page's key, see table below
        title: "Course Details",        // ← the page heading
    };
    </script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/student-shell.js"></script>
  <script src="js/student-course-details.js"></script>

</body>
</html>
