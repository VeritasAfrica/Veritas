<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Profile | VALMS</title>

  <link rel="stylesheet" href="css/admin-shell.css">
  <link rel="stylesheet" href="css/student-profile.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body>

  <div class="wrapper">

    <div id="sidebarMount"></div>

    <main class="main">

      <div id="topbarMount"></div>

      <div class="container">

        <a href="students.html" style="text-decoration: none; color: #34C759; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; margin-bottom: 20px;">
          <i class="fa-solid fa-arrow-left"></i> Back to Students
        </a>

        <div class="profile-card">

          <div class="profile-avatar" id="avatar">SS</div>

          <h2 id="studentName">Loading...</h2>

          <p id="studentMatric">Pending Assignment</p>

        </div>

        <div class="details">

          <div class="row">
            <label>First Name</label>
            <span id="firstName"></span>
          </div>

          <div class="row">
            <label>Middle Name</label>
            <span id="middleName"></span>
          </div>

          <div class="row">
            <label>Last Name</label>
            <span id="lastName"></span>
          </div>

          <div class="row">
            <label>Email</label>
            <span id="email"></span>
          </div>

          <div class="row">
            <label>Phone</label>
            <span id="phone"></span>
          </div>

          <div class="row">
            <label>Country</label>
            <span id="country"></span>
          </div>

          <div class="row">
            <label>Admission Year</label>
            <span id="year"></span>
          </div>

          <div class="row">
            <label>Cohort</label>
            <span id="cohort"></span>
          </div>

          <div class="row">
            <label>Matric Number</label>
            <span id="matric"></span>
          </div>

        </div>

        <div class="actions">

          <button id="editBtn">
            <i class="fa-solid fa-pen"></i>
            Edit Student
          </button>

          <button id="deleteBtn">
            <i class="fa-solid fa-trash"></i>
            Delete Student
          </button>

        </div>

      </div>

    </main>

  </div>

  <script>
    window.ADMIN_PAGE = {
      active: "students",
      title: "Student Profile"
    };
  </script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/admin-shell.js"></script>
  <script src="js/student-profile.js"></script>

</body>
</html>
