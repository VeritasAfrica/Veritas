<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Session Materials | Purpose Institute</title>

  <link rel="stylesheet" href="css/student-portal.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

  <div class="overlay" id="overlay"></div>

  <div class="wrapper">

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="logo">
        <h2>Purpose Institute</h2>
        <p>Student Portal</p>
      </div>

      <nav>
        <a href="dashboard.html">
          <i class="fa-solid fa-house"></i>
          Dashboard
        </a>

        <a href="student-courses.html" class="active">
          <i class="fa-solid fa-book"></i>
          My Courses
        </a>

        <a href="student-attendance.html">
          <i class="fa-solid fa-calendar-check"></i>
          Attendance
        </a>

        <a href="student-results.html">
          <i class="fa-solid fa-chart-column"></i>
          Results
        </a>

        <a href="profile.html">
          <i class="fa-solid fa-user"></i>
          My Profile
        </a>

        <a href="#" id="logoutBtn">
          <i class="fa-solid fa-right-from-bracket"></i>
          Logout
        </a>
      </nav>
    </aside>

    <!-- Main -->
    <main class="main">

      <header class="topbar">
        <button class="menu-btn" id="menuBtn">
          <i class="fa-solid fa-bars"></i>
        </button>

        <h2 id="sessionTitle">Loading...</h2>

        <div class="top-icons">
          <button><i class="fa-solid fa-bell"></i></button>
          <div class="avatar" id="topAvatar">SB</div>
        </div>
      </header>

      <p class="page-subtitle" id="sessionType"></p>

      <div id="sessionAction" style="margin-bottom: 25px;"></div>

      <div id="quizAction" style="margin-bottom: 25px;"></div>

      <div class="table-card">
        <div class="card-title">
          <h3>Session Description</h3>
        </div>
        <p id="description"></p>
      </div>

      <div class="table-card" style="margin-top: 30px;">
        <div class="card-title">
          <h3>Learning Materials</h3>
        </div>

        <table>
          <thead>
            <tr>
              <th>Title</th>
              <th>Type</th>
              <th>Open</th>
            </tr>
          </thead>
          <tbody id="materialTable"></tbody>
        </table>
      </div>

    </main>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/student-material-view.js"></script>

</body>
</html>
