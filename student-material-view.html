<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Session Materials | Purpose Institute</title>
  <link rel="stylesheet" href="css/student-shell.css">
  <link rel="stylesheet" href="css/student-portal.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

  <div class="wrapper">

    <!-- Sidebar -->
    <div id="sidebarMount"></div>

    <!-- Main -->
    <main class="main">

      <div id="topbarMount"></div>

      <h1 id="sessionTitle" style="margin-bottom: 4px;"></h1>

      <div id="sessionAction" style="margin-bottom: 25px;"></div>

      <div id="quizAction" style="margin-bottom: 25px;"></div>

      <div class="table-card">
        <div class="card-title">
          <h3>Session Description</h3>
        </div>
        <p id="description"></p>
      </div>

      <div class="table-card" style="margin-top: 30px;">
        <div class="card-title">
          <h3>Learning Materials</h3>
        </div>

        <table>
          <thead>
            <tr>
              <th>Title</th>
              <th>Type</th>
              <th>Open</th>
            </tr>
          </thead>
          <tbody id="materialTable"></tbody>
        </table>
      </div>

    </main>

  </div>

  <script>
    window.STUDENT_PAGE = {
      active: "materials",
      title: "Session Materials",
    };
  </script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/student-shell.js"></script>
  <script src="js/student-material-view.js"></script>

</body>
</html>
