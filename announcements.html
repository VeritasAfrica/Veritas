<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Announcements | Purpose Institute</title>

  <link rel="stylesheet" href="css/admin-shell.css">
  <link rel="stylesheet" href="css/admin.css">
  <link rel="stylesheet" href="css/create-course.css">
  <link rel="stylesheet" href="css/results.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body>

  <div class="wrapper">

    <div id="sidebarMount"></div>

    <main class="main">

      <div id="topbarMount"></div>

      <!-- New Announcement -->
      <div class="table-card">
        <div class="card-title">
          <h3>New Announcement</h3>
        </div>

        <div class="form-group">
          <label>Course</label>
          <select id="courseSelect"></select>
        </div>

        <div class="form-group">
          <label>Title</label>
          <input type="text" id="announcementTitle">
        </div>

        <div class="form-group">
          <label>Message</label>
          <textarea id="announcementMessage" rows="4"></textarea>
        </div>

        <div id="postMessage" style="margin-bottom: 16px; font-weight: 600;"></div>

        <button id="postBtn" class="assign-btn">
          <i class="fa-solid fa-bullhorn"></i>
          Post Announcement
        </button>
      </div>

      <!-- All Announcements -->
      <div class="table-card" style="margin-top: 30px;">
        <div class="card-title">
          <h3>All Announcements</h3>
        </div>

        <div class="filters-row">
          <input type="text" id="searchAnnouncement" placeholder="Search title or message...">
          <select id="filterCourse">
            <option value="">All Courses</option>
          </select>
        </div>

        <table>
          <thead>
            <tr>
              <th>Course</th>
              <th>Title</th>
              <th>Message</th>
              <th>Date</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="announcementsTable"></tbody>
        </table>
      </div>

    </main>

  </div>

  <script>
    window.ADMIN_PAGE = {
      active: "announcements",
      title: "Announcements",
      subtitle: "Post and manage announcements across all courses"
    };
  </script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/admin-shell.js"></script>
  <script src="js/announcements.js"></script>

</body>
</html>
