<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Groups | Purpose Institute</title>

  <link rel="stylesheet" href="css/admin-shell.css">
  <link rel="stylesheet" href="css/admin.css">
  <link rel="stylesheet" href="css/create-course.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body>

  <div class="wrapper">

    <div id="sidebarMount"></div>

    <main class="main">

      <div id="topbarMount"></div>

      <div class="table-card" style="margin-bottom: 25px;">
        <div class="card-title">
          <h3>General Group</h3>
        </div>
        <form id="generalGroupForm" style="display:flex; gap:14px; align-items:flex-end; flex-wrap:wrap;">
          <div style="flex:1; min-width:250px;">
            <label style="display:block; font-size:13px; color:#64748B; margin-bottom:6px;">WhatsApp Link</label>
            <input type="url" id="generalGroupLink" placeholder="https://chat.whatsapp.com/..."
                   style="width:100%; padding:10px 14px; border:1px solid #E2E8F0; border-radius:10px; font-family:'Poppins',sans-serif;">
          </div>
          <button type="submit" class="assign-btn">Save</button>
        </form>
      </div>

      <div class="table-card" style="margin-bottom: 25px;">
  <div class="card-title">
    <h3>Create Group</h3>
  </div>
  <form id="createGroupForm" style="display:flex; gap:14px; flex-wrap:wrap; align-items:flex-end;">
    <div>
      <label style="display:block; font-size:13px; color:#64748B; margin-bottom:6px;">Cohort</label>
      <input type="text" id="newGroupCohort" required placeholder="e.g. 01"
             style="padding:10px 14px; border:1px solid #E2E8F0; border-radius:10px; font-family:'Poppins',sans-serif;">
    </div>
    <div>
      <label style="display:block; font-size:13px; color:#64748B; margin-bottom:6px;">Year</label>
      <input type="text" id="newGroupYear" required readonly
             style="padding:10px 14px; border:1px solid #E2E8F0; border-radius:10px; font-family:'Poppins',sans-serif; background:#F8FAFC;">
    </div>
    <div>
      <label style="display:block; font-size:13px; color:#64748B; margin-bottom:6px;">Group Number</label>
      <input type="number" id="newGroupNumber" required min="1" placeholder="e.g. 1"
             style="padding:10px 14px; border:1px solid #E2E8F0; border-radius:10px; font-family:'Poppins',sans-serif;">
    </div>
    <div style="flex:1; min-width:200px;">
      <label style="display:block; font-size:13px; color:#64748B; margin-bottom:6px;">WhatsApp Link (optional)</label>
      <input type="url" id="newGroupLink" placeholder="https://chat.whatsapp.com/..."
             style="width:100%; padding:10px 14px; border:1px solid #E2E8F0; border-radius:10px; font-family:'Poppins',sans-serif;">
    </div>
    <button type="submit" class="assign-btn">Create Group</button>
  </form>
      </div>

      <div class="table-card">
        <div class="card-title">
          <h3>Student Groups</h3>
        </div>

        <table>
          <thead>
            <tr>
              <th>Group</th>
              <th>Members</th>
              <th>WhatsApp Link</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="groupsTable"></tbody>
        </table>
      </div>

    </main>

  </div>

  <script>
    window.ADMIN_PAGE = {
      active: "groups",
      title: "Groups",
    };
  </script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/admin-shell.js"></script>
  <script src="js/groups.js"></script>

</body>
</html>
