<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VALMS | Student Dashboard</title>
    <link rel="stylesheet" href="css/student-shell.css">

    <link rel="stylesheet" href="css/dashboard.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

    <!-- Mobile Overlay -->

    <div class="overlay" id="overlay"></div>
    <div class="wrapper">
        <!-- ==========================
             Sidebar
        =========================== -->
        <div id="sidebarMount"></div>

        <!-- ==========================
             Main Content
        =========================== -->
        <main class="main">
            <!-- Top Navigation -->
            <div id="topbarMount"></div>

            <!-- Welcome -->
            <section class="welcome">
                <h1>
                    <span id="welcomeMessage">
                        Good Morning,
                    </span>

                    <span id="studentName">
                        Student
                    </span>
                    👋
                </h1>

                <p>
                    Welcome back to VALMS.
                </p>

            </section>

            <!-- Matric Number -->
            <section class="matric-card">
                <h3>
                    <i class="fa-solid fa-graduation-cap"></i>
                    Matric Number
                </h3>

                <h1 id="matric">
                    Pending Assignment
                </h1>

            </section>

            <!-- Today's Schedule -->
            <section class="panel">
                <h2>
                    📅 Today's Schedule
                </h2>

                <p>
                    No classes scheduled today.
                </p>

            </section>

            <!-- Announcements -->
            <section class="panel">
                <h2>
                    📢 Announcements
                </h2>

                <p>
                    No announcements at the moment.
                </p>

            </section>

            <!-- Notifications -->
            <section class="panel">
                <h2>
                    🔔 Notifications
                </h2>

                <p>
                    You're all caught up.
                </p>

            </section>

        </main>

    </div>

    <!-- Scripts -->
    <script>
    window.STUDENT_PAGE = {
        active: "dashboard",       // ← this page's key, see table below
        title: "Dashboard",        // ← the page heading
    };
    </script>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="js/config.js"></script>

    <script src="js/auth.js"></script>
    <script src="js/student-shell.js"></script>

    <script src="js/dashboard.js"></script>

</body>

</html>
