name: Daily Student Reminders

on:
  schedule:
    # Runs at 13:00 UTC every day — adjust the hour to fit your timezone
    - cron: "30 14 * * *"
  workflow_dispatch: {}   # lets you also trigger it manually from the Actions tab

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Call the reminder function
        run: |
          curl -X POST "https://ebcjwbxufsxygfvzjckz.supabase.co/functions/v1/send-daily-reminders" \
            -H "x-cron-secret: ${{ secrets.REMINDER_CRON_SECRET }}"