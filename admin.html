<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Purpose Institute Admin</title>
  <link rel="stylesheet" href="css/admin-shell.css">
  <link rel="stylesheet" href="css/admin.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body>

  <div class="wrapper">

    <!-- Sidebar -->
    <div id="sidebarMount"></div>

    <!-- Main -->
    <main class="main">

      <!-- Top -->
      <div id="topbarMount"></div>

      <!-- Cards -->
      <section class="stats">

        <div class="card green">
          <div>
            <h4>Total Students</h4>
            <h2 id="studentCount">0</h2>
          </div>
          <i class="fa-solid fa-user-graduate"></i>
        </div>

        <div class="card blue">
          <div>
            <h4>Courses</h4>
            <h2 id="courseCount">0</h2>
            <p>Available</p>
          </div>
          <i class="fa-solid fa-book"></i>
        </div>

        <div class="card orange">
          <div>
            <h4>Departments</h4>
            <h2 id="departmentCount">0</h2>
            <p>With active courses</p>
          </div>
          <i class="fa-solid fa-building"></i>
        </div>

        <div class="card purple">
          <div>
            <h4>Attendance Records</h4>
            <h2 id="attendanceTotal">0</h2>
            <p>All time</p>
          </div>
          <i class="fa-solid fa-user-check"></i>
        </div>

      </section> 

      <!-- Bottom Section -->
      <section class="bottom-grid">

        <!-- Recent Registrations -->
        <div class="table-card">
          <div class="card-title">
            <h3>Recent Student Registrations</h3>
            <a href="students.html">View All</a>
          </div>

          <table>
            <thead>
              <tr>
                <th>Student</th>
                <th>Email</th>
                <th>Status</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="studentTable"></tbody>
          </table>
        </div>

        <!-- To-Do List -->
        <div class="pending-card">
          <div class="card-title">
            <h3>To-Do</h3>
          </div>

          <div class="pending-list" id="todoList"></div>
        </div>

      </section>

      <!-- Charts -->
      <section class="chart-grid">

        <div class="chart-card">
          <div class="card-title">
            <h3>Attendance Trend (Last 7 Days)</h3>
          </div>
          <canvas id="attendanceChart"></canvas>
        </div>

        <div class="chart-card">
          <div class="card-title">
            <h3>Student Distribution by Department</h3>
          </div>
          <canvas id="departmentChart"></canvas>
        </div>

      </section>

      <!-- Quick Actions -->
      <section class="quick-actions">

        <button id="generateMatric">
          <i class="fa-solid fa-id-card"></i>
          <span>Generate Matric Numbers</span>
        </button>

        <button id="assignGroupsBtn">
          <i class="fa-solid fa-users"></i>
          <span>Assign Groups</span>
        </button>

        <button id="createCourseBtn">
          <i class="fa-solid fa-book"></i>
          <span>Create Course</span>
        </button>

      </section>

    </main>

  </div>
  <script>
  window.ADMIN_PAGE = {
    active: "dashboard",
    title: "Dashboard",
  };
  </script>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/admin-shell.js"></script>
  <script src="js/admin.js"></script>

</body>
</html>
