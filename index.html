<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Veritas Africa LMS | Student Registration</title>

    <link rel="stylesheet" href="css/style.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

<div class="page">
    <div class="card">
        <div class="header">
            <!-- Replace with your logo later -->
            <div class="logo">
                <i class="fa-solid fa-graduation-cap"></i>
            </div>

            <h1>Veritas Africa LMS</h1>

            <p>
                Building Human Capital For Africa's Role In The Global Economy!
            </p>

            <div class="status open">
                Registration Open
            </div>

        </div>

        <form id="registerForm">
            <div class="grid">
                <div class="form-group">
                    <label>First Name *</label>
                    <input
                        type="text"
                        id="first_name"
                        required
                        autocomplete="given-name"
                    >
                </div>

                <div class="form-group">
                    <label>Middle Name</label>
                    <input
                        type="text"
                        id="middle_name"
                        autocomplete="additional-name"
                    >
                </div>

            </div>

            <div class="form-group">
                <label>Last Name *</label>
                <input
                    type="text"
                    id="last_name"
                    required
                    autocomplete="family-name"
                >

            </div>
            <div class="form-group">
                <label>Email Address *</label>
                <input
                    type="email"
                    id="email"
                    required
                    autocomplete="email"
                >
            </div>

            <div class="grid">
                <div class="form-group">
                    <label>Phone Number *</label>
                    <input
                        type="tel"
                        id="phone"
                        required
                        autocomplete="tel"
                    >

                </div>

                <!--
                Uncomment this block once the next cohort should start
                choosing a department at registration. Until then, every
                student defaults to "All" via the database column default.

                <div class="form-group">
                    <label>Department *</label>
                    <select id="department" required>
                        <option value="">Select Department</option>
                        <option value="Creative">Creative</option>
                        <option value="Entrepreneur">Entrepreneur</option>
                        <option value="Corporate">Corporate</option>
                    </select>
                </div>
                -->

                <div class="form-group">

                    <label for="country">Country</label>

                    <input type="text" id="country" list="countryList" placeholder="Type to search..." autocomplete="off" required>
                    <datalist id="countryList"></datalist>

                </div>

            </div>

            <div class="form-group">

                <label>Password *</label>

                <div class="password-box">

                    <input
                        type="password"
                        id="password"
                        required
                    >

                    <button
                        type="button"
                        class="toggle-password"
                        data-target="password"
                    >
                        <i class="fa-solid fa-eye"></i>
                    </button>

                </div>

                <div class="strength">

                    <div id="strengthBar"></div>

                </div>

                <small id="strengthText">
                    Password Strength
                </small>

            </div>

            <div class="form-group">

                <label>Confirm Password *</label>

                <div class="password-box">

                    <input
                        type="password"
                        id="confirm_password"
                        required
                    >

                    <button
                        type="button"
                        class="toggle-password"
                        data-target="confirm_password"
                    >
                        <i class="fa-solid fa-eye"></i>
                    </button>

                </div>

            </div>

            <label class="checkbox">

                <input
                    type="checkbox"
                    id="terms"
                    required
                >

                <span>
                    I agree to the Terms & Conditions
                </span>

            </label>

            <button
                id="submitBtn"
                type="submit"
            >
                Create Account
            </button>

        </form>

        <div id="message"></div>

        <div class="footer">

            Already have an account?

            <a href="login.html">

                Login

            </a>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/config.js"></script>

<script src="js/utils.js"></script>

<script src="js/validation.js"></script>

<script src="js/ui.js"></script>

<script src="js/auth.js"></script>

<script src="js/profile.js"></script>

<script src="js/countries.js"></script>

<script src="js/register.js"></script>

</body>
</html>
