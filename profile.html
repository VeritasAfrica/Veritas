<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VALMS | My Profile</title>
    <link rel="stylesheet" href="css/student-shell.css">
    <link rel="stylesheet" href="css/profile.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

<div class="overlay" id="overlay"></div>
<div class="wrapper">
    <!-- Sidebar -->
    <div id="sidebarMount"></div>

    <!-- Main -->
    <main class="main">
        <!-- Topbar -->
        <div id="topbarMount"></div>

        <!-- Profile Card -->
        <section class="profile-card">
            <div class="profile-header">
                <div class="profile-avatar" id="profileAvatar">
                    SB
                </div>

                <h2 id="fullName">
                    Loading...
                </h2>

                <p id="matricNumber">
                    Pending Assignment
                </p>

            </div>

            <div class="profile-details">

                <div class="detail-row">
                    <span>Email:</span>
                    <strong id="email"></strong>
                </div>

                <div class="detail-row">
                    <span>Phone:</span>
                    <strong id="phone"></strong>
                </div>

                <div class="detail-row">
                    <span>Country:</span>
                    <strong id="country"></strong>
                </div>

                <div class="detail-row">
                    <span>Admission Year:</span>
                    <strong id="admissionYear"></strong>
                </div>

                <div class="detail-row">
                    <span>Cohort:</span>
                    <strong id="cohort"></strong>
                </div>

            </div>

        </section>

    </main>

</div>
<script>
    window.STUDENT_PAGE = {
        active: "profile",       // ← this page's key, see table below
        title: "My Profile",        // ← the page heading
    };
    </script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/config.js"></script>

<script src="js/auth.js"></script>
<script src="js/student-shell.js"></script>

<script src="js/profile.js"></script>

</body>

</html>
