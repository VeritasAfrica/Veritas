<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Take Quiz | Purpose Institute</title>

  <link rel="stylesheet" href="css/student-shell.css">
  <link rel="stylesheet" href="css/take-quiz.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

  <div class="wrapper">

    <div id="sidebarMount"></div>

    <main class="main">

      <div id="topbarMount"></div>

      <p class="page-subtitle" id="quizDescription"></p>

      <form id="quizForm">
        <div id="questionList"></div>

        <button type="submit" id="submitQuizBtn" class="mark-btn" style="margin-top: 20px;">
          Submit Quiz
        </button>
      </form>

      <div id="resultBox" style="display: none;"></div>

    </main>

  </div>

  <script>
    window.STUDENT_PAGE = {
      active: "courses",
      title: "Quiz"
    };
  </script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/student-shell.js"></script>
  <script src="js/take-quiz.js"></script>

</body>
</html>
