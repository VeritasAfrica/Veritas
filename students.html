<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Students | VALMS</title>

  <link rel="stylesheet" href="css/admin-shell.css">
  <link rel="stylesheet" href="css/students.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body>

  <div class="wrapper">

    <div id="sidebarMount"></div>

    <main class="main">

      <div id="topbarMount"></div>

      <div style="margin-bottom: 25px;">
        <button id="generateMatric">
          <i class="fa-solid fa-id-card"></i>
          Generate Matric Numbers
        </button>
      </div>

      <!-- Cards -->
      <section class="cards">

        <div class="stat">
          <h4>Total Students</h4>
          <h2 id="totalStudents">0</h2>
        </div>

        <div class="stat">
          <h4>Assigned Matric</h4>
          <h2 id="assignedMatric">0</h2>
        </div>

        <div class="stat">
          <h4>Pending Matric</h4>
          <h2 id="pendingMatric">0</h2>
        </div>

        <div class="stat">
          <h4>International</h4>
          <h2 id="internationalStudents">0</h2>
        </div>

      </section>

      <!-- Filters -->
      <section class="filters">
        <input type="text" id="searchStudent" placeholder="Search student...">

        <select id="filterYear">
          <option value="">Admission Year</option>
        </select>

        <select id="filterCountry">
          <option value="">Country</option>
        </select>
      </section>

      <!-- Students Table -->
      <div class="table-card">
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Email</th>
              <th>Country</th>
              <th>Admission</th>
              <th>Matric</th>
              <th>Status</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="studentTable"></tbody>
        </table>
      </div>

    </main>

  </div>

  <script>
    window.ADMIN_PAGE = {
      active: "students",
      title: "Students",
    };
  </script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/admin-shell.js"></script>
  <script src="js/students.js"></script>

</body>
</html>
